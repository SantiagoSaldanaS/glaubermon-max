[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glaubermon"
version = "0.1.0"
description = "Superhuman Game-Theoretic AI for Pokémon Showdown"
readme = "README.md"
authors = [{ name = "Pokechamp AI" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "websockets>=12.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["glaubermon*"]
